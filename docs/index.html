<!DOCTYPE html>
<!--
  Gym Tracker
  v1.3.0 — 2026-08-23
  Canvis: substituït window.storage (només vàlid dins l'Artifact de Claude) per localStorage,
  que sí funciona en un fitxer HTML obert directament al navegador. Afegida còpia de seguretat
  manual (exportar/importar JSON) com a xarxa de seguretat davant pèrdua de dades del navegador.
-->
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Gym Tracker v1.3.0</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16181b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --bg:#16181b;
  --surface:#1e2125;
  --surface-2:#262a2f;
  --line:#33383e;
  --ink:#ece9e2;
  --ink-dim:#93989e;
  --iron:#c4432b;
  --iron-dim:#7a3226;
  --chalk-blue:#5f89a3;
  --plate-green:#5a8c5a;
  --plate-yellow:#c7a339;
  --font-display:'Oswald',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-tap-highlight-color:transparent;
  min-height:100vh;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:76px;}

header.top{
  padding:22px 18px 14px;
  border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bg);z-index:5;
}
header.top .brand{
  display:flex;align-items:baseline;gap:10px;
}
header.top .brand .mark{
  width:10px;height:22px;background:var(--iron);border-radius:2px;
  box-shadow:6px 0 0 var(--surface-2), -6px 0 0 var(--surface-2);
}
header.top h1{
  font-family:var(--font-display);
  font-weight:700;
  font-size:22px;
  letter-spacing:1px;
  margin:0;
  text-transform:uppercase;
}
header.top .sub{
  color:var(--ink-dim);font-size:12.5px;margin-top:4px;font-family:var(--font-mono);
}

main{flex:1;padding:16px;}

section{display:none;}
section.active{display:block;animation:fade .18s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:16px;
  margin-bottom:14px;
}
.card h2{
  font-family:var(--font-display);
  font-size:16px;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin:0 0 12px;
  color:var(--ink);
  display:flex;align-items:center;justify-content:space-between;
}
label{
  display:block;font-size:12px;color:var(--ink-dim);
  margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;
}
input[type=text],input[type=number],select,input[type=date]{
  width:100%;background:var(--surface-2);border:1px solid var(--line);
  color:var(--ink);border-radius:7px;padding:9px 10px;font-size:15px;
  font-family:var(--font-mono);
}
input[type=text]{font-family:var(--font-body);}
select{font-family:var(--font-body);}
.row{display:flex;gap:8px;}
.row > *{flex:1;}
.field{margin-bottom:10px;}

button{
  font-family:var(--font-body);font-weight:600;font-size:14px;
  border:none;border-radius:7px;padding:10px 14px;cursor:pointer;
}
.btn-primary{background:var(--iron);color:#fff;}
.btn-primary:active{background:var(--iron-dim);}
.btn-ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--line);}
.btn-ghost:active{background:var(--surface-2);}
.btn-sm{padding:6px 10px;font-size:12.5px;}
.btn-danger{background:transparent;color:var(--iron);border:1px solid var(--iron-dim);}

.exercise-block{
  border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px;background:var(--surface-2);
}
.exercise-block .ex-head{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
}
.exercise-block .ex-name{font-weight:600;font-size:14.5px;}
.exercise-block .ex-meta{font-size:11.5px;color:var(--ink-dim);font-family:var(--font-mono);}
.ex-head-main{display:flex;gap:10px;align-items:center;}

.ex-icon{
  width:40px;height:40px;min-width:40px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  color:var(--iron);padding:8px;flex-shrink:0;
}
.ex-icon svg{width:100%;height:100%;}

.plate-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.plate{
  width:56px;height:56px;border-radius:50%;
  border:3px solid var(--iron);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:15px;color:var(--ink);
  background:radial-gradient(circle at 35% 30%, #2c3036, var(--surface));
  flex-shrink:0;
}
.set-col{display:flex;flex-direction:column;align-items:center;gap:6px;}
.set-col input{width:64px;text-align:center;padding:6px 4px;font-size:13px;}
.set-col .setlabel{font-size:10px;color:var(--ink-dim);font-family:var(--font-mono);}

.suggestion{
  font-size:12.5px;background:var(--surface);border:1px dashed var(--line);
  border-radius:7px;padding:8px 10px;margin-bottom:10px;color:var(--ink-dim);
}
.suggestion b{color:var(--ink);}
.suggestion.up{border-color:var(--plate-green);color:var(--plate-green);}
.suggestion.down{border-color:var(--iron);color:var(--iron);}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 8px;text-align:center;}
.stat .v{font-family:var(--font-mono);font-weight:700;font-size:17px;}
.stat .l{font-size:10px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.4px;margin-top:2px;}

.chart-wrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;}
.chart-wrap h3{font-family:var(--font-display);font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px;color:var(--ink-dim);}
canvas{max-width:100%;}

.model-note{font-size:11.5px;color:var(--ink-dim);line-height:1.5;margin-top:6px;}

nav.bottom{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;max-width:480px;margin:0 auto;
}
nav.bottom button{
  flex:1;background:none;border-radius:0;padding:12px 4px 10px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-dim);font-size:11px;text-transform:uppercase;letter-spacing:.3px;
}
nav.bottom button.active{color:var(--iron);}
nav.bottom svg{width:20px;height:20px;}

.session-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.session-date{font-family:var(--font-display);font-size:16px;text-transform:uppercase;letter-spacing:.5px;}
.session-routine{font-size:11.5px;color:var(--ink-dim);font-family:var(--font-mono);margin-top:2px;}
.hist-ex{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);}
.hist-ex:first-of-type{border-top:none;padding-top:6px;}
.hist-ex-name{font-weight:600;font-size:13.5px;margin-bottom:5px;}
.hist-sets{display:flex;flex-wrap:wrap;gap:6px;}
.hist-set-chip{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-dim);}
.hist-set-chip b{color:var(--ink);}

.empty{color:var(--ink-dim);font-size:13px;text-align:center;padding:20px 10px;}
.pill{display:inline-block;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--ink-dim);font-family:var(--font-mono);}
.inline-del{background:none;border:none;color:var(--ink-dim);font-size:16px;padding:2px 6px;cursor:pointer;}
.add-ex-form{display:flex;gap:6px;margin-top:10px;}
.add-ex-form input{flex:1;}
.bw-toggle{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-dim);text-transform:none;letter-spacing:0;margin-top:2px;}
.bw-toggle input{width:auto;}
select#unitSelect{width:auto;display:inline-block;}
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div class="brand"><div class="mark"></div><h1>Gym Tracker</h1></div>
    <div class="sub" id="headerSub">seguiment de força · v1.3.0</div>
  </header>

  <main>

    <!-- RUTINES -->
    <section id="tab-routines">
      <div id="routinesContainer"></div>
      <div class="card">
        <h2>Nova rutina</h2>
        <div class="field">
          <label>Nom de la rutina</label>
          <input type="text" id="newRoutineName" placeholder="p. ex. Push day">
        </div>
        <button class="btn-primary" onclick="createRoutine()">Crear rutina</button>
      </div>
    </section>

    <!-- REGISTRAR -->
    <section id="tab-log">
      <div class="card">
        <h2>Sessió</h2>
        <div class="row">
          <div class="field">
            <label>Data de l'entrenament</label>
            <input type="date" id="logDate" onchange="renderLogForm()">
          </div>
          <div class="field">
            <label>Rutina</label>
            <select id="logRoutineSelect" onchange="renderLogForm()"></select>
          </div>
        </div>
      </div>
      <div id="logExercises"></div>
      <button class="btn-primary" style="width:100%;padding:13px;" onclick="saveSession()">Desar sessió</button>
    </section>

    <!-- PROGRES -->
    <section id="tab-progress">
      <div class="card">
        <h2>Exercici</h2>
        <select id="progressExerciseSelect" onchange="renderProgress()"></select>
      </div>
      <div id="progressBody"></div>
    </section>

    <!-- HISTORIAL -->
    <section id="tab-history">
      <div class="card">
        <h2>Còpia de seguretat</h2>
        <div class="row">
          <button class="btn-ghost btn-sm" onclick="exportData()">Exportar dades</button>
          <label class="btn-ghost btn-sm" style="text-align:center;cursor:pointer;">
            Importar
            <input type="file" accept="application/json" style="display:none" onchange="importDataFile(this)">
          </label>
        </div>
        <div class="model-note">Les dades es guarden només en aquest navegador/dispositiu. Exporta una còpia de tant en tant per no perdre-les si esborres dades del navegador o canvies de mòbil.</div>
      </div>
      <div id="historyContainer"></div>
    </section>

  </main>

  <nav class="bottom">
    <button data-tab="tab-routines" onclick="showTab('tab-routines')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="9" width="3" height="6"/><rect x="19" y="9" width="3" height="6"/><rect x="6" y="6" width="3" height="12"/><rect x="15" y="6" width="3" height="12"/><line x1="9" y1="12" x2="15" y2="12"/></svg>
      Rutines
    </button>
    <button data-tab="tab-log" onclick="showTab('tab-log')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Registrar
    </button>
    <button data-tab="tab-progress" onclick="showTab('tab-progress')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      Progrés
    </button>
    <button data-tab="tab-history" onclick="showTab('tab-history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      Historial
    </button>
  </nav>

</div>

<script>
/* ---------- helpers ---------- */
const APP_VERSION = '1.3.0';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const round5 = n => Math.round(n*10)/10;

const CATS = {
  'compound-lower': {label:'Compost, cama', inc:10},
  'push': {label:'Empènyer', inc:5},
  'pull': {label:'Estirar', inc:5},
  'isolation-lower': {label:'Aïllament, cama', inc:5},
  'isolation-upper': {label:'Aïllament, braç', inc:5},
  'core': {label:'Abdominal', inc:5},
  'other': {label:'Altre', inc:5}
};

function guessCategory(name){
  const n = name.toLowerCase();
  if(n.includes('leg press')) return 'compound-lower';
  if(n.includes('leg curl') || n.includes('leg extension')) return 'isolation-lower';
  if(n.includes('lat pull') || n.includes('row') || n.includes('remo')) return 'pull';
  if(n.includes('bench') || n.includes('press') && !n.includes('leg')) return 'push';
  if(n.includes('curl')) return 'isolation-upper';
  if(n.includes('dip') || n.includes('tricep')) return 'isolation-upper';
  if(n.includes('crunch') || n.includes('abdom') || n.includes('core')) return 'core';
  return 'other';
}

/* ---------- exercise icons ---------- */
function svgWrap(inner){
  return `<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}
const ICONS = {
  legpress: svgWrap('<rect x="4" y="20" width="9" height="10" rx="1"/><line x1="13" y1="25" x2="24" y2="14"/><rect x="24" y="6" width="7" height="16" rx="1"/>'),
  latpulldown: svgWrap('<line x1="10" y1="8" x2="30" y2="8"/><line x1="20" y1="8" x2="14" y2="18"/><line x1="20" y1="8" x2="26" y2="18"/><circle cx="20" cy="22" r="3"/><line x1="20" y1="25" x2="20" y2="34"/>'),
  benchpress: svgWrap('<line x1="6" y1="12" x2="34" y2="12"/><circle cx="9" cy="12" r="3"/><circle cx="31" cy="12" r="3"/><line x1="10" y1="26" x2="30" y2="26"/><line x1="14" y1="26" x2="14" y2="32"/><line x1="26" y1="26" x2="26" y2="32"/>'),
  legcurl: svgWrap('<line x1="7" y1="14" x2="20" y2="14"/><line x1="20" y1="14" x2="20" y2="23"/><line x1="20" y1="23" x2="30" y2="29"/><circle cx="30" cy="29" r="3"/>'),
  bicepcurl: svgWrap('<line x1="16" y1="32" x2="16" y2="18"/><line x1="16" y1="18" x2="24" y2="10"/><circle cx="27" cy="7" r="2.5"/><circle cx="21" cy="13" r="2.5"/>'),
  tricepdip: svgWrap('<line x1="10" y1="6" x2="10" y2="32"/><line x1="30" y1="6" x2="30" y2="32"/><line x1="10" y1="14" x2="30" y2="14"/><circle cx="20" cy="10" r="3"/><line x1="20" y1="13" x2="20" y2="24"/><line x1="20" y1="24" x2="14" y2="30"/><line x1="20" y1="24" x2="26" y2="30"/>'),
  crunch: svgWrap('<circle cx="10" cy="24" r="3"/><path d="M13 24 Q22 10 30 20"/><line x1="30" y1="20" x2="30" y2="30"/><line x1="30" y1="20" x2="24" y2="26"/>'),
  default: svgWrap('<line x1="8" y1="20" x2="32" y2="20"/><rect x="5" y="14" width="6" height="12" rx="2"/><rect x="29" y="14" width="6" height="12" rx="2"/>')
};
function getExerciseIcon(name){
  const n = (name||'').toLowerCase();
  if(n.includes('leg press')) return ICONS.legpress;
  if(n.includes('lat pull') || n.includes('pulldown') || n.includes('pull down')) return ICONS.latpulldown;
  if(n.includes('bench')) return ICONS.benchpress;
  if(n.includes('leg curl')) return ICONS.legcurl;
  if(n.includes('bicep')) return ICONS.bicepcurl;
  if(n.includes('tricep') || n.includes('dip')) return ICONS.tricepdip;
  if(n.includes('crunch') || n.includes('abdom') || n.includes('core')) return ICONS.crunch;
  return ICONS.default;
}
function iconBadge(name){
  return `<div class="ex-icon">${getExerciseIcon(name)}</div>`;
}

/* ---------- state ---------- */
let routines = [];
let sessions = [];

const DEFAULT_ROUTINE = {
  id: uid(),
  name: 'Body sculpt',
  exercises: [
    {name:'Leg press', cat:'compound-lower'},
    {name:'Lat pull down', cat:'pull'},
    {name:'Bench press', cat:'push'},
    {name:'Leg curl', cat:'isolation-lower'},
    {name:'Bicep curl', cat:'isolation-upper'},
    {name:'Tricep dip', cat:'isolation-upper', noWeight:true},
    {name:'Abdominal crunch', cat:'core'}
  ].map(e => ({
    id: uid(), name:e.name, cat:e.cat,
    targetSets:3, targetReps:10, increment: CATS[e.cat].inc, startWeight:0,
    noWeight: !!e.noWeight
  }))
};

/* ---------- persistence ---------- */
const LS_PREFIX = 'gymtracker:';
let storageAvailable = true;

function lsGet(key){
  try{ return localStorage.getItem(LS_PREFIX+key); }
  catch(e){ storageAvailable = false; return null; }
}
function lsSet(key, value){
  try{ localStorage.setItem(LS_PREFIX+key, value); return true; }
  catch(e){ storageAvailable = false; console.error('storage error', e); return false; }
}

async function loadState(){
  const r = lsGet('routines');
  try{ routines = r ? JSON.parse(r) : [DEFAULT_ROUTINE]; }catch(e){ routines = [DEFAULT_ROUTINE]; }
  const s = lsGet('sessions');
  try{ sessions = s ? JSON.parse(s) : []; }catch(e){ sessions = []; }
  if(!routines.length){ routines = [DEFAULT_ROUTINE]; }
  persistRoutines();
}
async function persistRoutines(){ lsSet('routines', JSON.stringify(routines)); }
async function persistSessions(){ lsSet('sessions', JSON.stringify(sessions)); }

/* ---------- manual backup (export / import) ---------- */
function exportData(){
  const payload = {app:'gym-tracker', version:APP_VERSION, exportedAt:new Date().toISOString(), routines, sessions};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gym-tracker-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importDataFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const data = JSON.parse(e.target.result);
      if(!data || !Array.isArray(data.routines) || !Array.isArray(data.sessions)){
        alert('El fitxer no té el format esperat d\u2019una còpia de seguretat.');
        return;
      }
      if(!confirm('Això substituirà totes les dades actuals per les de la còpia de seguretat. Vols continuar?')) return;
      routines = data.routines;
      sessions = data.sessions;
      await persistRoutines();
      await persistSessions();
      renderRoutines(); refreshSelectors(); renderHistory();
      alert('Dades importades correctament.');
    }catch(err){
      alert('No s\u2019ha pogut llegir el fitxer. Assegura\u2019t que és una còpia de seguretat exportada des d\u2019aquesta app.');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

/* ---------- tabs ---------- */
function showTab(id){
  document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  if(id==='tab-log') renderLogForm();
  if(id==='tab-progress') renderProgress();
  if(id==='tab-history') renderHistory();
}

/* ---------- ROUTINES TAB ---------- */
function renderRoutines(){
  const c = document.getElementById('routinesContainer');
  if(!routines.length){ c.innerHTML = '<p class="empty">Encara no tens cap rutina.</p>'; return; }
  c.innerHTML = routines.map(r => `
    <div class="card">
      <h2>${r.name} <button class="inline-del" onclick="deleteRoutine('${r.id}')">✕</button></h2>
      ${r.exercises.map(ex => `
        <div class="exercise-block">
          <div class="ex-head">
            <div class="ex-head-main">
              ${iconBadge(ex.name)}
              <div>
                <div class="ex-name">${ex.name}</div>
                <div class="ex-meta">${CATS[ex.cat]?.label || 'Altre'}</div>
              </div>
            </div>
            <button class="inline-del" onclick="deleteExercise('${r.id}','${ex.id}')">✕</button>
          </div>
          <div class="row">
            <div class="field"><label>Sèries</label><input type="number" min="1" value="${ex.targetSets}" onchange="updateExercise('${r.id}','${ex.id}','targetSets',this.value)"></div>
            <div class="field"><label>Reps</label><input type="number" min="1" value="${ex.targetReps}" onchange="updateExercise('${r.id}','${ex.id}','targetReps',this.value)"></div>
            ${ex.noWeight ? '' : `<div class="field"><label>Incr. kg</label><input type="number" min="0" step="0.5" value="${ex.increment}" onchange="updateExercise('${r.id}','${ex.id}','increment',this.value)"></div>`}
          </div>
          <label class="bw-toggle"><input type="checkbox" ${ex.noWeight?'checked':''} onchange="updateExercise('${r.id}','${ex.id}','noWeight',this.checked)"> Pes corporal (sense seguiment de pes)</label>
        </div>
      `).join('')}
      <div class="add-ex-form">
        <input type="text" id="newEx-${r.id}" placeholder="Nou exercici">
        <button class="btn-ghost btn-sm" onclick="addExercise('${r.id}')">Afegir</button>
      </div>
    </div>
  `).join('');
}

function createRoutine(){
  const input = document.getElementById('newRoutineName');
  const name = input.value.trim();
  if(!name) return;
  routines.push({id:uid(), name, exercises:[]});
  input.value='';
  persistRoutines(); renderRoutines(); refreshSelectors();
}
function deleteRoutine(id){
  routines = routines.filter(r=>r.id!==id);
  persistRoutines(); renderRoutines(); refreshSelectors();
}
function addExercise(routineId){
  const input = document.getElementById('newEx-'+routineId);
  const name = input.value.trim();
  if(!name) return;
  const cat = guessCategory(name);
  const r = routines.find(x=>x.id===routineId);
  r.exercises.push({id:uid(), name, cat, targetSets:3, targetReps:10, increment:CATS[cat].inc, startWeight:0, noWeight:false});
  persistRoutines(); renderRoutines(); refreshSelectors();
}
function deleteExercise(routineId, exId){
  const r = routines.find(x=>x.id===routineId);
  r.exercises = r.exercises.filter(e=>e.id!==exId);
  persistRoutines(); renderRoutines(); refreshSelectors();
}
function updateExercise(routineId, exId, field, value){
  const r = routines.find(x=>x.id===routineId);
  const ex = r.exercises.find(e=>e.id===exId);
  if(field==='noWeight'){ ex.noWeight = value===true || value==='true'; }
  else { ex[field] = parseFloat(value); }
  persistRoutines();
  renderRoutines();
}

/* ---------- suggestion engine ---------- */
function lastEntryFor(routineId, exId){
  for(let i=sessions.length-1;i>=0;i--){
    const s = sessions[i];
    if(s.routineId!==routineId) continue;
    const entry = s.entries.find(e=>e.exerciseId===exId);
    if(entry) return {session:s, entry};
  }
  return null;
}

function suggestNext(routine, ex){
  const last = lastEntryFor(routine.id, ex.id);
  if(ex.noWeight){
    if(!last) return {weight:null, note:'Pes corporal — registra només les repeticions.', tone:''};
    const sets = last.entry.sets;
    const target = ex.targetReps;
    const metCount = sets.filter(s=>s.reps>=target).length;
    if(metCount === sets.length) return {weight:null, note:`Vas completar totes les sèries a ${target} reps. Prova d'afegir-hi alguna repetició més.`, tone:'up'};
    if(metCount === 0) return {weight:null, note:'No vas arribar a l\u2019objectiu de repeticions. Manté el mateix objectiu.', tone:'down'};
    return {weight:null, note:'Vas completar algunes sèries. Repeteix el mateix objectiu de reps.', tone:''};
  }
  if(!last){
    return {weight: ex.startWeight||0, note:"Primera vegada — comença amb un pes còmode i ajusta a partir d'aquí.", tone:''};
  }
  const sets = last.entry.sets;
  const target = ex.targetReps;
  const metCount = sets.filter(s=>s.reps>=target).length;
  const lastWeight = Math.max(...sets.map(s=>s.weight||0), 0);
  if(metCount === sets.length){
    return {weight: round5(lastWeight+ex.increment), note:`Vas completar totes les sèries a ${target} reps. Puja pes.`, tone:'up'};
  } else if(metCount === 0){
    return {weight: Math.max(0, round5(lastWeight - ex.increment/2)), note:"Cap sèrie va arribar a l'objectiu. Baixa una mica el pes.", tone:'down'};
  } else {
    return {weight: lastWeight, note:'Vas completar algunes sèries. Repeteix el mateix pes.', tone:''};
  }
}

/* ---------- LOG TAB ---------- */
function refreshSelectors(){
  const logSel = document.getElementById('logRoutineSelect');
  logSel.innerHTML = routines.map(r=>`<option value="${r.id}">${r.name}</option>`).join('');
  const progSel = document.getElementById('progressExerciseSelect');
  let opts = [];
  routines.forEach(r=>r.exercises.forEach(ex=>{
    opts.push(`<option value="${r.id}::${ex.id}">${r.name} — ${ex.name}</option>`);
  }));
  progSel.innerHTML = opts.join('') || '<option value="">—</option>';
}

function renderLogForm(){
  if(!document.getElementById('logDate').value){
    document.getElementById('logDate').value = new Date().toISOString().slice(0,10);
  }
  const routineId = document.getElementById('logRoutineSelect').value;
  const routine = routines.find(r=>r.id===routineId);
  const container = document.getElementById('logExercises');
  if(!routine){ container.innerHTML='<p class="empty">Crea una rutina primer.</p>'; return; }
  if(!routine.exercises.length){ container.innerHTML='<p class="empty">Aquesta rutina no té exercicis.</p>'; return; }

  container.innerHTML = routine.exercises.map(ex=>{
    const sug = suggestNext(routine, ex);
    const rows = Array.from({length: ex.targetSets}).map((_,i)=>`
      <div class="set-col">
        <div class="setlabel">SET ${i+1}</div>
        <div class="plate">${i+1}</div>
        <input type="number" class="reps-input" data-ex="${ex.id}" data-set="${i}" placeholder="reps" value="${ex.targetReps}">
        ${ex.noWeight ? '' : `<input type="number" class="weight-input" step="0.5" data-ex="${ex.id}" data-set="${i}" placeholder="kg" value="${sug.weight}">`}
      </div>
    `).join('');
    const suggestionHtml = ex.noWeight
      ? `<div class="suggestion ${sug.tone}">${sug.note}</div>`
      : `<div class="suggestion ${sug.tone}"><b>Pes suggerit: ${sug.weight} kg.</b> ${sug.note}</div>`;
    return `
      <div class="exercise-block" data-exercise-id="${ex.id}">
        <div class="ex-head">
          <div class="ex-head-main">
            ${iconBadge(ex.name)}
            <div>
              <div class="ex-name">${ex.name}</div>
              <div class="ex-meta">Objectiu: ${ex.targetSets}×${ex.targetReps}${ex.noWeight ? ' · pes corporal' : ''}</div>
            </div>
          </div>
        </div>
        ${suggestionHtml}
        <div class="plate-row">${rows}</div>
      </div>
    `;
  }).join('');
}

async function saveSession(){
  const routineId = document.getElementById('logRoutineSelect').value;
  const routine = routines.find(r=>r.id===routineId);
  if(!routine) return;
  const date = document.getElementById('logDate').value;
  const entries = routine.exercises.map(ex=>{
    const repInputs = document.querySelectorAll(`.reps-input[data-ex="${ex.id}"]`);
    const wInputs = document.querySelectorAll(`.weight-input[data-ex="${ex.id}"]`);
    const sets = Array.from(repInputs).map((inp,i)=>({
      reps: parseFloat(inp.value)||0,
      weight: wInputs[i] ? (parseFloat(wInputs[i].value)||0) : 0
    }));
    return {exerciseId: ex.id, exerciseName: ex.name, sets};
  });
  sessions.push({id:uid(), date, routineId, entries});
  sessions.sort((a,b)=> a.date.localeCompare(b.date));
  await persistSessions();
  renderLogForm();
  showTab('tab-history');
}

/* ---------- HISTORY TAB ---------- */
function formatDateDisplay(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('ca-ES', {day:'2-digit', month:'short', year:'numeric'});
}

function renderHistory(){
  const c = document.getElementById('historyContainer');
  if(!sessions.length){
    c.innerHTML = '<p class="empty">Encara no has registrat cap sessió. La teva llibreta digital començarà aquí en desar el primer entrenament.</p>';
    return;
  }
  const sorted = [...sessions].sort((a,b)=> b.date.localeCompare(a.date));
  c.innerHTML = sorted.map(s=>{
    const routine = routines.find(r=>r.id===s.routineId);
    return `
      <div class="card">
        <div class="session-head">
          <div>
            <div class="session-date">${formatDateDisplay(s.date)}</div>

          </div>
          <button class="inline-del" onclick="deleteSession('${s.id}')">✕</button>
        </div>
        ${s.entries.map(e=>{
          const exDef = routine ? routine.exercises.find(x=>x.id===e.exerciseId) : null;
          const noWeight = exDef ? exDef.noWeight : false;
          return `
          <div class="hist-ex">
            <div class="ex-icon">${getExerciseIcon(e.exerciseName)}</div>
            <div>
              <div class="hist-ex-name">${e.exerciseName}</div>
              <div class="hist-sets">
                ${e.sets.map((st,i)=> noWeight
                  ? `<span class="hist-set-chip">S${i+1}: <b>${st.reps}</b> reps</span>`
                  : `<span class="hist-set-chip">S${i+1}: <b>${st.weight}kg</b> × ${st.reps}</span>`
                ).join('')}
              </div>
            </div>
          </div>
        `;}).join('')}
      </div>

}

async function deleteSession(id){
  sessions = sessions.filter(s=>s.id!==id);
  await persistSessions();
  renderHistory();
}

/* ---------- PROGRESS TAB / PREDICTION MODEL ---------- */
let progressChart = null;
let volumeChart = null;

function epley1RM(weight, reps){ return weight*(1+reps/30); }

function collectSeries(routineId, exId){
  const points = [];
  sessions.filter(s=>s.routineId===routineId).forEach(s=>{
    const entry = s.entries.find(e=>e.exerciseId===exId);
    if(!entry) return;
    const best = Math.max(...entry.sets.map(st=>epley1RM(st.weight||0, st.reps||0)), 0);
    const volume = entry.sets.reduce((a,st)=>a+(st.weight||0)*(st.reps||0),0);
    const totalReps = entry.sets.reduce((a,st)=>a+(st.reps||0),0);
    points.push({date:s.date, e1rm: round5(best), volume: round5(volume), totalReps});
  });
  return points;
}

// simple least-squares fit of metric(t) = a + b*ln(t+1), t = session index
function fitLogModel(points, field){
  const n = points.length;
  const xs = points.map((_,i)=>Math.log(i+1+1)); // t=i+1 (1-indexed), ln(t+1)
  const ys = points.map(p=>p[field]);
  const xbar = xs.reduce((a,b)=>a+b,0)/n;
  const ybar = ys.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  for(let i=0;i<n;i++){ num += (xs[i]-xbar)*(ys[i]-ybar); den += (xs[i]-xbar)**2; }
  const b = den===0 ? 0 : num/den;
  const a = ybar - b*xbar;
  return {a,b};
}

function renderProgress(){
  const sel = document.getElementById('progressExerciseSelect').value;
  const body = document.getElementById('progressBody');
  if(!sel){ body.innerHTML = '<p class="empty">Afegeix una rutina i registra alguna sessió.</p>'; return; }
  const [routineId, exId] = sel.split('::');
  const routine = routines.find(r=>r.id===routineId);
  const ex = routine ? routine.exercises.find(e=>e.id===exId) : null;
  const points = collectSeries(routineId, exId);

  if(!ex){ body.innerHTML='<p class="empty">Exercici no trobat.</p>'; return; }
  if(points.length===0){
    body.innerHTML = '<p class="empty">Encara no hi ha sessions registrades per aquest exercici.</p>';
    return;
  }

  const sug = suggestNext(routine, ex);
  const labels = points.map(p=>p.date);

  if(ex.noWeight){
    const metricField = 'totalReps';
    const actual = points.map(p=>p.totalReps);
    const lastPt = points[points.length-1];
    const bestPt = points.reduce((m,p)=>p.totalReps>m.totalReps?p:m, points[0]);

    body.innerHTML = `
      <div class="stat-grid">
        <div class="stat"><div class="v">${lastPt.totalReps}</div><div class="l">Reps totals últ.</div></div>
        <div class="stat"><div class="v">${bestPt.totalReps}</div><div class="l">Millor sessió</div></div>
        <div class="stat"><div class="v">${ex.targetReps}</div><div class="l">Objectiu / sèrie</div></div>
      </div>
      <div class="suggestion ${sug.tone}">${sug.note}</div>
      <div class="chart-wrap">
        <h3>Repeticions totals per sessió i predicció</h3>
        <canvas id="e1rmCanvas" height="180"></canvas>
        <div class="model-note" id="modelNote"></div>
      </div>
    `;

    let projLabels = [], projValues = [];
    const noteEl = document.getElementById('modelNote');
    if(points.length >= 3){
      const {a,b} = fitLogModel(points, metricField);
      const FUTURE = 5;
      for(let k=1;k<=FUTURE;k++){
        const t = points.length + k;
        projLabels.push('P'+k);
        projValues.push(Math.max(0, round5(a + b*Math.log(t+1))));
      }
      const trend = b>0 ? "a l'alça" : (b<0 ? 'a la baixa' : 'estable');
      noteEl.innerHTML = `Exercici de pes corporal: es projecten repeticions totals, no pes. Model simplificat (corba logarítmica), tendència ${trend}. No té en compte descans, nutrició ni tècnica — és una guia, no una garantia.`;
    } else {
      noteEl.innerHTML = 'Calen almenys 3 sessions registrades per generar una predicció.';
    }

    const allLabels = labels.concat(projLabels);
    const actualPadded = actual.concat(Array(projValues.length).fill(null));
    const projPadded = Array(actual.length-1).fill(null).concat([actual[actual.length-1]]).concat(projValues);

    if(progressChart) progressChart.destroy();
    if(volumeChart){ volumeChart.destroy(); volumeChart = null; }
    const ctx = document.getElementById('e1rmCanvas').getContext('2d');
    progressChart = new Chart(ctx, {
      type:'line',
      data:{
        labels: allLabels,
        datasets:[
          {label:'Reps totals', data: actualPadded, borderColor:'#c4432b', backgroundColor:'rgba(196,67,43,0.15)', tension:0.25, pointRadius:3, fill:true},
          {label:'Predicció', data: projPadded, borderColor:'#5f89a3', borderDash:[5,4], pointRadius:2, fill:false}
        ]
      },
      options:{
        responsive:true,
        plugins:{ legend:{labels:{color:'#93989e', font:{family:'Inter', size:11}}} },
        scales:{
          x:{ ticks:{color:'#93989e', font:{size:10}}, grid:{color:'#33383e'} },
          y:{ ticks:{color:'#93989e', font:{size:10}}, grid:{color:'#33383e'} }
        }
      }
    });
    return;
  }

  const actual = points.map(p=>p.e1rm);
  const lastPt = points[points.length-1];
  const bestPt = points.reduce((m,p)=>p.e1rm>m.e1rm?p:m, points[0]);

  body.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="v">${lastPt.e1rm}</div><div class="l">1RM est. (kg)</div></div>
      <div class="stat"><div class="v">${bestPt.e1rm}</div><div class="l">Millor 1RM</div></div>
      <div class="stat"><div class="v">${sug.weight}</div><div class="l">Pes suggerit</div></div>
    </div>
    <div class="chart-wrap">
      <h3>1RM estimat i predicció</h3>
      <canvas id="e1rmCanvas" height="180"></canvas>
      <div class="model-note" id="modelNote"></div>
    </div>
    <div class="chart-wrap">
      <h3>Volum per sessió (kg × reps)</h3>
      <canvas id="volCanvas" height="160"></canvas>
    </div>
  `;

  let projLabels = [], projValues = [];
  const noteEl = document.getElementById('modelNote');

  if(points.length >= 3){
    const {a,b} = fitLogModel(points, 'e1rm');
    const FUTURE = 5;
    for(let k=1;k<=FUTURE;k++){
      const t = points.length + k;
      const val = round5(a + b*Math.log(t+1));
      projLabels.push('P'+k);
      projValues.push(val);
    }
    const trend = b>0 ? "a l'alça" : (b<0 ? 'a la baixa' : 'estable');
    noteEl.innerHTML = `Model simplificat: corba logarítmica ajustada a les teves sessions (guany ràpid a l'inici, rendiments decreixents després), tendència ${trend}. No té en compte descans, nutrició ni tècnica — és una guia, no una garantia.`;
  } else {
    noteEl.innerHTML = 'Calen almenys 3 sessions registrades per generar una predicció.';
  }

  const allLabels = labels.concat(projLabels);
  const actualPadded = actual.concat(Array(projValues.length).fill(null));
  const projPadded = Array(actual.length-1).fill(null).concat([actual[actual.length-1]]).concat(projValues);

  if(progressChart) progressChart.destroy();
  const ctx = document.getElementById('e1rmCanvas').getContext('2d');
  progressChart = new Chart(ctx, {
    type:'line',
    data:{
      labels: allLabels,
      datasets:[
        {label:'1RM estimat', data: actualPadded, borderColor:'#c4432b', backgroundColor:'rgba(196,67,43,0.15)', tension:0.25, pointRadius:3, fill:true},
        {label:'Predicció', data: projPadded, borderColor:'#5f89a3', borderDash:[5,4], pointRadius:2, fill:false}
      ]
    },
    options:{
      responsive:true,
      plugins:{ legend:{labels:{color:'#93989e', font:{family:'Inter', size:11}}} },
      scales:{
        x:{ ticks:{color:'#93989e', font:{size:10}}, grid:{color:'#33383e'} },
        y:{ ticks:{color:'#93989e', font:{size:10}}, grid:{color:'#33383e'} }
      }
    }
  });

  if(volumeChart) volumeChart.destroy();
  const ctx2 = document.getElementById('volCanvas').getContext('2d');
  volumeChart = new Chart(ctx2, {
    type:'bar',
    data:{ labels, datasets:[{label:'Volum', data: points.map(p=>p.volume), backgroundColor:'#c7a339'}] },
    options:{
      responsive:true,
      plugins:{ legend:{display:false} },
      scales:{
        x:{ ticks:{color:'#93989e', font:{size:10}}, grid:{display:false} },
        y:{ ticks:{color:'#93989e', font:{size:10}}, grid:{color:'#33383e'} }
      }
    }
  });
}

  await loadState();
  document.getElementById('headerSub').textContent = `seguiment de força · v${APP_VERSION}`;
  if(!storageAvailable){
    document.getElementById('headerSub').innerHTML += ' <span style="color:var(--iron)">· ⚠ desat local no disponible, exporta sovint</span>';
  }
  renderRoutines();
  refreshSelectors();
  document.getElementById('logDate').value = new Date().toISOString().slice(0,10);
  showTab('tab-routines');
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
